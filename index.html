<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Black Icarus</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; background: #0b0a12; color: #e8e6f0; font: 16px/1.5 system-ui, sans-serif; }
  main { max-width: 960px; margin: 0 auto; padding: 32px 16px 48px; }
  h1 { font-size: 22px; margin: 0 0 16px; letter-spacing: .5px; }
  .stage { border-radius: 8px; overflow: hidden; box-shadow: 0 0 0 2px #f0f0f0, 0 0 0 4px #2a3398; }
  p { color: #b8b6c8; }
  code { background: #1a1930; padding: 2px 6px; border-radius: 4px; font-size: 14px; }
</style>
</head>
<body>
<main>
  <h1>Black Icarus</h1>
  <div class="stage" data-black-icarus></div>
  <p>He builds wings, flies at the sun, the wax melts, he falls, and he builds again. Drawn entirely in code.</p>
  <p>To embed: <code>&lt;div data-black-icarus&gt;&lt;/div&gt;&lt;script src="icarus.js"&gt;&lt;/script&gt;</code></p>
</main>
<script src="icarus.js"></script>
</body>
</html>
